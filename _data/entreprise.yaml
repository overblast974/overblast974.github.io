# ---------------------------------------------------------------------
# Questions fréquentes, page par page (textes de docs/agence/CONTENU.md).
# Les réponses sont du HTML court. Elles ne recopient aucune valeur : elles
# y renvoient entre accolades, et le site met la valeur à la place :
#   {zone}  {communes}  {zone_suite}  {horaires}  {horaires_courts}  {telephone}  {email}
#   {seance} (prix d'une séance)  {duree_seance}  {absence}
# {absence} disparaît de lui-même à la date de reprise.
# La copie pour Google (FAQPage) est faite à partir du même texte.
# ---------------------------------------------------------------------
faq:
  accueil:            # index.html, bloc 7 (aucune phrase d'absence : rien de daté pour Google). Réponse 2 : relecture du juriste (c1).
    - question: "Faut-il une ordonnance pour commencer ?"
      reponse: "<p>Non. Vous pouvez me contacter avec ou sans ordonnance. Si vous vivez avec une maladie chronique ou si vous reprenez après un long arrêt, parlez-en d'abord à votre médecin. S'il vous prescrit de l'activité physique adaptée, je m'appuie sur ses indications pour construire vos séances.</p>"
    - question: "Est-ce remboursé ?"
      reponse: "<p>Pas par l'Assurance maladie, même avec une ordonnance : elle ne rembourse pas l'activité physique adaptée à la personne qui pratique. Certaines mutuelles en prennent une partie en charge, souvent sur présentation d'une ordonnance, et certaines communes proposent des aides. Interrogez votre complémentaire santé et le centre communal d'action sociale (CCAS) de votre commune : je ne peux pas savoir à l'avance ce qui vous sera remboursé.</p>"
      complement: "<a href=\"/pages/activite-physique-adaptee.html#cout\">Le détail, avec les sources</a>"   # affiché à la suite, absent de la copie FAQPage
    - question: "Où et quand ont lieu les séances ?"
      reponse: "<p>Chez vous ou en extérieur, à {zone}. {horaires}. Une séance dure {duree_seance}. Nous choisissons le lieu au premier rendez-vous.</p>"
  apa:            # pages/activite-physique-adaptee.html (texte du lot 1, retouche n° 6 de CONTENU.md)
    - question: "Faut-il une ordonnance pour commencer ?"
      reponse: "<p>Non. Vous pouvez me contacter directement, avec ou sans ordonnance. Si vous vivez avec une maladie chronique ou si vous reprenez après un long arrêt, je vous conseille d'en parler d'abord à votre médecin. S'il vous remet une prescription d'activité physique adaptée, je m'appuie sur ses indications pour construire vos séances.</p>"
    - question: "Quel médecin peut prescrire de l'activité physique adaptée ?"
      reponse: "<p>Tout médecin qui vous suit, généraliste ou spécialiste. Il rédige la prescription sur un formulaire prévu pour cela, avec votre accord, pour une durée de trois à six mois, renouvelable.</p>"
    - question: "Le sport sur ordonnance est-il remboursé ?"
      reponse: "<p>L'Assurance maladie ne rembourse pas le sport sur ordonnance à la personne qui pratique. Certaines mutuelles remboursent l'activité physique adaptée sur présentation de l'ordonnance, et certaines collectivités proposent des aides : posez la question à votre complémentaire santé et au centre communal d'action sociale (CCAS) de votre commune.</p>"
    - question: "Quelle différence avec des séances de kinésithérapie ?"
      reponse: "<p>Le kinésithérapeute est un professionnel de santé : la rééducation, c'est lui. Je suis enseignant en activité physique adaptée : je vous aide à bouger régulièrement, avec des exercices adaptés à vos capacités. J'interviens en complément, ou une fois la rééducation terminée, jamais à sa place.</p>"
    - question: "Mon médecin est-il tenu au courant ?"
      reponse: "<p>Seulement si vous le souhaitez. Lorsqu'il y a une prescription, le code de la santé publique prévoit un bilan au début, des comptes rendus périodiques et un bilan à la fin du programme. Ils vous sont destinés, et ne sont transmis au médecin qui a rédigé la prescription et à votre médecin traitant qu'avec votre accord.</p>"
    - question: "Où et quand ont lieu les séances ?"
      reponse: "<p>À {communes} et dans {zone_suite} : chez vous ou en extérieur. Une séance dure {duree_seance}. Les séances ont lieu {horaires}. {absence}</p>"
  coaching:            # pages/coaching-sportif.html
    - question: "Je n'ai jamais fait de sport : est-ce pour moi ?"
      reponse: "<p>Oui. Nous partons de votre niveau du jour, avec des exercices simples, et nous avançons pas à pas. Si vous vivez avec une maladie chronique ou un handicap, voyez plutôt l'<a href=\"/pages/activite-physique-adaptee.html\">activité physique adaptée</a>.</p>"
    - question: "Combien de séances par semaine ?"
      reponse: "<p>Nous en décidons ensemble au premier rendez-vous, selon vos objectifs, votre niveau et votre temps. Je vous propose un rythme, et des exercices à faire seul entre les séances si vous le souhaitez.</p>"
    - question: "Où ont lieu les séances ?"
      reponse: "<p>Chez vous ou en extérieur (parc, bord de mer), à {zone}. J'apporte le matériel.</p>"
    - question: "Le coaching comprend-il des conseils sur l'alimentation ?"
      reponse: "<p>Des repères de base, oui, pendant les séances. Pour aller plus loin, l'accompagnement alimentaire est une prestation à part : voir <a href=\"/pages/conseils-nutritionnels.html\">Alimentation et activité physique</a>.</p>"
  alimentation:            # pages/conseils-nutritionnels.html
    - question: "Faut-il suivre un régime strict ?"
      reponse: "<p>Non. Je ne propose pas de régime restrictif, mais des changements progressifs, adaptés à votre mode de vie.</p>"
    - question: "Vous adaptez-vous aux choix alimentaires particuliers ?"
      reponse: "<p>Oui : végétarien, végétalien, sans porc… Je pars de ce que vous mangez.</p>"
    - question: "Et si j'ai une maladie, une allergie ou une intolérance ?"
      reponse: "<p>Votre alimentation relève alors de votre médecin ou d'un diététicien. Je travaille en complément, en suivant leurs consignes.</p>"
    - question: "Comment se passe le suivi ?"
      reponse: "<p>Après le premier point, nous fixons ensemble un calendrier. Les rendez-vous durent {duree_seance} et ont lieu en personne, chez vous.</p>"
