# =====================================================================
#  Coach APA'R : la source unique des informations du site
# =====================================================================
#  C'est le seul fichier à modifier pour changer un prix, un horaire,
#  le téléphone ou la phrase d'absence. Mode d'emploi : LISEZ-MOI.md.
#
#  Règles de saisie :
#   - un prix est un nombre entier d'euros, sans « € » (exemple : 450) ;
#   - une date s'écrit "AAAA-MM-JJ" entre guillemets (exemple : "2027-01-11") ;
#   - une heure s'écrit "HH:MM" entre guillemets (exemple : "17:30") ;
#   - l'indentation (les espaces en début de ligne) compte : ne pas la changer.
#  Une erreur de saisie arrête la fabrication : rien n'est publié, le site
#  en ligne reste tel qu'il était.
#
#  État au 25/11/2026 (lot F, branche refonte/site) : les pages de la refonte
#  lisent ce fichier. Rien de ce qui est ici n'est recopié à la main dans une
#  page : prix, remises, horaires, zone, téléphone, e-mail, phrase d'absence,
#  questions fréquentes et données pour Google en sortent tous.
# =====================================================================

